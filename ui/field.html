<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1120" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>FirstLight Field</title>
  <link rel="stylesheet" href="/vendor/leaflet.css" />
  <link rel="stylesheet" href="/field.css" />
</head>
<body>
  <div id="field-map" aria-label="Assigned route map"></div>

  <header class="field-topbar">
    <div class="field-brand">
      <span class="field-logo" aria-hidden="true">FL</span>
      <span>FirstLight Field</span>
    </div>
    <div class="field-pills">
      <span class="fpill" id="link-pill" title="Live link to the command laptop over local Wi-Fi">
        <span class="fdot" id="link-dot"></span>
        <span id="link-text">Connecting…</span>
      </span>
      <span class="fpill" id="ai-pill" title="Where AI reasoning currently runs">AI: —</span>
    </div>
  </header>

  <div class="field-banner hidden" id="uplink-banner" role="status">
    Internet lost — still live over local Wi-Fi. AI now runs on the command laptop.
  </div>

  <div class="field-toast hidden" id="update-toast" role="status" aria-live="polite"></div>

  <section class="field-sheet" id="field-sheet">
    <button type="button" class="sheet-handle" id="sheet-handle" aria-label="Show all route steps" aria-expanded="false"></button>
    <div class="sheet-head">
      <span class="vehicle-chip" id="vehicle-chip">—</span>
      <span class="route-status" id="route-status">Waiting for dispatch…</span>
    </div>
    <div class="route-metrics">
      <div>
        <div class="metric-val" id="metric-eta">—</div>
        <div class="metric-label">ETA</div>
      </div>
      <div>
        <div class="metric-val" id="metric-dist">—</div>
        <div class="metric-label">Distance</div>
      </div>
      <div>
        <div class="metric-val" id="metric-avoided">—</div>
        <div class="metric-label">Blockages avoided</div>
      </div>
    </div>
    <div class="next-instruction" id="next-instruction"></div>
    <ol class="step-list" id="step-list"></ol>
    <div class="sheet-foot">
      <span id="updated-ago">—</span>
      <span>© OpenStreetMap contributors · NOAA imagery</span>
    </div>
  </section>

  <script src="/vendor/leaflet.js"></script>
  <script src="/field.js"></script>
</body>
</html>
