[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "firstlight"
version = "0.2.0"
description = "Which vehicles can reach whom after a hurricane: SAM 3.1 road-width measurement, vehicle-specific routing and an offline-capable Meta model agent."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Anbesa Tech LLC" }]
# Runtime dependencies are listed in requirements.txt (install with pip install -r requirements.txt).
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
